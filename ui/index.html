<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gemma · Board voice</title><link rel="stylesheet" href="style.css"></head>
<body data-state="idle"><main>
<p class="eyebrow">GEMMA · LIVE BOARD ANALYSIS</p>
<div class="orb-wrap" aria-hidden="true"><div class="orb"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="gloss"></div></div></div>
<div id="transcript" class="transcript" aria-live="polite"><p class="line now">Let’s take a look at your board.</p></div>
<div class="controls"><button id="analyze">Analyze board</button><button id="replay" hidden>Play voice</button><button id="stop" hidden>Stop voice</button></div>
<p id="status" role="status">Checking camera and Jetson…</p>
<details id="capture" hidden><summary id="frame-label">Frame used for this analysis</summary><img id="frame" alt="Exact camera frame analyzed by Gemma"></details>
<p class="hint">One click · one latest camera frame · one Gemma analysis. No robot movement.</p>
<audio id="voice" preload="auto"></audio>
</main><script type="module" src="app.js"></script></body></html>
